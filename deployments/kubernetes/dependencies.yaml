apiVersion: v1
kind: Secret
metadata:
  name: aiops-deps
  namespace: aiops
type: Opaque
stringData:
  mysql-password: "aiops123"
  mysql-root-password: "root123"
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: aiops
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aiops-deps
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: aiops
            - name: MYSQL_USER
              value: aiops
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aiops-deps
                  key: mysql-password
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-uaiops", "-paiops123"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: aiops
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
